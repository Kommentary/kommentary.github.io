baseURL = 'https://kommentary.github.io/'
languageCode = 'en-us'
title = 'Kommentary by Kutterer'
theme = 'clarity'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[pagination]
  pagerSize = 10 # Number of posts per page

[Params]
  description = "Fact-based political commentary" # Description of your site
  opengraph = true
  twitter_cards = false
  readmore = false # Show "Read more" button in list if true
  authorbox = false
  pager = true
  post_meta = ["date", "categories"] # Order of post meta information
  mainSections = ["post", "docs"]

[Params.author]
  name = "Josh Kutterer"
  avatar = "img/avatar.png"

[Params.style.vars]
  highlightColor = "#2563EB" # Blue accent color (minimalist style)
  fontFamilyPrimary = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

[Params.logo]
  subtitle = "A data-based political commentary blog" # Logo subtitle

[Params.sidebar]
  home = "right"   # Configure layout for home page
  list = "right"   # Configure layout for list pages
  single = "right" # Configure layout for single pages
  # Enable widgets in given order
  widgets = ["recent", "categories", "taglist"]

[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget
  tags_counter = false # Enable counter for each tag in "Tags" widget (disabled by default)

[Params.widgets.search]
  cached = false # activate cache if true
  url = "https://google.com/search"
  [Params.widgets.search.input]
    name = "sitesearch"
    pre = ""